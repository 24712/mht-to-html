<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHT Converter - Fixed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:560px;margin:0 auto;padding:20px 16px 40px;background:linear-gradient(160deg,#eef2f7,#f7f9fc);color:#1f2933;min-height:100vh}
  .box{background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 24px rgba(15,23,42,.08);border:1px solid #e5e9f0}
  h1{font-size:19px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  h1::before{content:"⇄";background:#0066cc;color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-size:15px}
  .hint{font-size:13px;color:#64748b;margin:0 0 14px}
  label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600;color:#334155}
  input[type=file]{width:100%;padding:12px;font-size:15px;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:10px;cursor:pointer}
  select{width:100%;padding:12px;font-size:15px;border:1.5px solid #cbd5e1;border-radius:10px;background:#fff;color:#1f2933}
  .check{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px;color:#334155;cursor:pointer}
  button{width:100%;background:#0066cc;color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;transition:background .15s}
  button:disabled{background:#cbd5e1;cursor:not-allowed}
  button.loading::after{content:"";display:inline-block;width:14px;height:14px;margin-inline-start:8px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;line-height:1.5;display:none}
  .status.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;display:block}
  .status.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;display:block}
  .status.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block}
  @media (prefers-color-scheme: dark){
    body{background:#0f172a;color:#e2e8f0}
    .box{background:#1e293b;border-color:#334155}
    label,.check{color:#cbd5e1}
    input[type=file],select{background:#0f172a;border-color:#475569;color:#e2e8f0}
    .hint{color:#94a3b8}
  }
</style>
</head>
<body>
<div class="box">
  <h1>تحويل MHT (النسخة الدقيقة)</h1>
  <p class="hint">حل مشاكل الستايلات والجافاسكريبت والمسارات.</p>

  <label>طريقة التحويل:</label>
  <select id="mode">
    <option value="zip">ملف ZIP (زي كروم: index.html + فولدر _files)</option>
    <option value="single">ملف HTML واحد (كل شيء مدمج)</option>
    <option value="plain">نص فقط</option>
  </select>

  <label class="check">
    <input type="checkbox" id="forceDesktop" checked>
    فتح الصفحة بوضع الكمبيوتر (Desktop View)
  </label>

  <label>اختر الملفات:</label>
  <input type="file" id="file" accept=".mht,.mhtml,.eml" multiple>

  <button id="go" disabled>تحويل وتنزيل</button>
  <div id="status" class="status"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const status = (msg, cls) => { const s=$('status'); s.className='status '+cls; s.innerHTML = msg; };

$('file').addEventListener('change', () => { $('go').disabled = $('file').files.length === 0; });

$('go').addEventListener('click', async () => {
  const files = Array.from($('file').files);
  if (files.length === 0) return;

  $('go').disabled = true;
  $('go').classList.add('loading');
  
  const mode = $('mode').value;
  const forceDesktop = $('forceDesktop').checked;

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    status(`جاري معالجة الملف ${i+1} من ${files.length}…`, 'info');
    await new Promise(r => setTimeout(r, 100));

    try {
      const buf = new Uint8Array(await f.arrayBuffer());
      let text = '';
      for (let j = 0; j < buf.length; j += 8192) {
        text += String.fromCharCode.apply(null, buf.subarray(j, j + 8192));
      }

      const baseName = f.name.replace(/\.(mht|mhtml|eml)$/i,'');
      const result = convertMHT(text, mode, forceDesktop);

      if (mode === 'zip') {
        status(`جاري ضغط الملفات ${i+1}…`, 'info');
        await new Promise(r => setTimeout(r, 100));
        const zip = new JSZip();
        zip.file("index.html", result.html);
        
        if (result.files && result.files.length > 0) {
          const folder = zip.folder("_files");
          result.files.forEach(file => folder.file(file.name, file.bytes));
        }
        
        const blob = await zip.generateAsync({type:"blob", compression: "DEFLATE"});
        downloadBlob(blob, baseName + '.zip');
      } else {
        const blob = new Blob([result.html], {type:'text/html;charset=utf-8'});
        downloadBlob(blob, baseName + '.html');
      }

      await new Promise(r => setTimeout(r, 500)); 
    } catch (e) {
      console.error("Error processing", f.name, e);
      status(`خطأ في الملف ${f.name}: ${e.message}`, 'err');
      await new Promise(r => setTimeout(r, 2000));
    }
  }

  status(`تم الانتهاء من تحويل ${files.length} ملفات بنجاح ✓`, 'ok');
  $('go').disabled = false;
  $('go').classList.remove('loading');
});

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

function fixMojibake(text) {
  return text
    .replace(/â€‹/g, '').replace(/â€Ž/g, '').replace(/â€™/g, '’').replace(/â€˜/g, '‘')
    .replace(/â€œ/g, '“').replace(/â€\u009D/g, '”').replace(/â€“/g, '–').replace(/â€”/g, '—')
    .replace(/Â /g, ' ').replace(/Â/g, '')
    .replace(/Ã©/g, 'é').replace(/Ã¨/g, 'è').replace(/Ãª/g, 'ê').replace(/Ã«/g, 'ë')
    .replace(/Ã /g, 'à').replace(/Ã¢/g, 'â').replace(/Ã®/g, 'î').replace(/Ã´/g, 'ô').replace(/Ã»/g, 'û')
    .replace(/Ã§/g, 'ç').replace(/Ã±/g, 'ñ').replace(/Ã¼/g, 'ü').replace(/Ã¶/g, 'ö').replace(/Ã¤/g, 'ä');
}

function decodeBytes(bytes, charsetHint, isHtml) {
  if (bytes.length >= 3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF)
    return new TextDecoder('utf-8').decode(bytes.subarray(3));
  const tryCs = (cs) => {
    if (!cs) return null;
    try { return new TextDecoder(cs.trim().toLowerCase(), {fatal:true}).decode(bytes); } catch { return null; }
  };
  let r = tryCs('utf-8'); if (r !== null) return r;
  r = tryCs(charsetHint); if (r !== null) return r;
  if (isHtml) {
    const head = new TextDecoder('windows-1252').decode(bytes.subarray(0, Math.min(bytes.length, 4096)));
    const m = head.match(/charset\s*=\s*["']?([^"'\s/>;]+)/i);
    if (m) { r = tryCs(m[1]); if (r !== null) return r; }
  }
  for (const cs of ['windows-1256','iso-8859-6','windows-1252','iso-8859-1']) {
    r = tryCs(cs); if (r !== null) return r;
  }
  return new TextDecoder('utf-8').decode(bytes);
}

function parseHeaders(headerText) {
  const headers = {};
  let key = null;
  for (const line of headerText.split(/\r?\n/)) {
    if (/^[ \t]/.test(line) && key) headers[key] += ' ' + line.trim();
    else { const m = line.match(/^([^:]+):\s*(.*)$/); if (m){ key=m[1].toLowerCase(); headers[key]=m[2]; } }
  }
  return headers;
}

function getExtension(mime) {
  if (mime.includes('text/css')) return '.css';
  if (mime.includes('javascript') || mime.includes('ecmascript')) return '.js';
  if (mime.includes('image/jpeg') || mime.includes('image/jpg')) return '.jpg';
  if (mime.includes('image/png')) return '.png';
  if (mime.includes('image/svg+xml')) return '.svg';
  if (mime.includes('image/webp')) return '.webp';
  if (mime.includes('image/gif')) return '.gif';
  if (mime.includes('font/woff2') || mime.includes('font/woff')) return '.woff2';
  if (mime.includes('font/woff')) return '.woff';
  if (mime.includes('font/ttf') || mime.includes('x-font-ttf')) return '.ttf';
  if (mime.includes('font/otf') || mime.includes('x-font-opentype')) return '.otf';
  return '';
}

function convertMHT(text, mode, forceDesktop) {
  const bm = text.match(/boundary\s*=\s*"?([^"\r\n;]+)"?/i);
  if (!bm) throw new Error('ملف MHT غير صالح');
  const boundary = bm[1].trim();
  
  const resources = new Map(); 
  let htmlText = null;
  let htmlBaseUrl = 'http://localhost/';
  let maxHtmlLen = 0;
  const usedNames = new Set();

  function processPart(p) {
    p = p.replace(/^(\r?\n)+/, '');
    if (p.startsWith('--') || !p.trim()) return;
    const split = p.search(/\r?\n\r?\n/);
    if (split === -1) return;
    const sep = p.substring(split).match(/^\r?\n\r?\n/)[0];
    const headerText = p.substring(0, split);
    let body = p.substring(split + sep.length).replace(/\r?\n$/, '');

    const headers = parseHeaders(headerText);
    const ct = (headers['content-type'] || '').toLowerCase();
    const enc = (headers['content-transfer-encoding'] || '').toLowerCase().trim();
    
    let loc = (headers['content-location'] || '').trim();
    if (loc.startsWith('<') && loc.endsWith('>')) loc = loc.slice(1, -1);
    
    let cid = (headers['content-id'] || '').trim();
    if (cid.startsWith('<') && cid.endsWith('>')) cid = cid.slice(1, -1);

    const mime = ct.split(';')[0].trim() || 'application/octet-stream';

    if (mime.startsWith('multipart/')) {
      const innerBm = ct.match(/boundary\s*=\s*"?([^"\r\n;]+)"?/i);
      if (innerBm) {
        for (const inner of body.split('--' + innerBm[1].trim())) processPart(inner);
        return;
      }
    }

    const cm = ct.match(/charset\s*=\s*"?([^";\s]+)"?/);
    let bytes;
    
    try {
      if (enc === 'base64') {
        const clean = body.replace(/[^A-Za-z0-9+/=]/g, '');
        const bin = atob(clean);
        bytes = new Uint8Array(bin.length);
        for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      } else if (enc === 'quoted-printable') {
        const dec = body.replace(/=\r?\n|=\r/g,'').replace(/=([0-9A-F]{2})/gi,(_,h)=>String.fromCharCode(parseInt(h,16)));
        bytes = new Uint8Array(dec.length);
        for (let i=0;i<dec.length;i++) bytes[i] = dec.charCodeAt(i) & 0xff;
      } else {
        bytes = new Uint8Array(body.length);
        for (let i=0;i<body.length;i++) bytes[i] = body.charCodeAt(i) & 0xff;
      }
    } catch (e) { return; }

    if (mime === 'text/html' || loc.endsWith('.html')) {
      const htmlStr = decodeBytes(bytes, cm ? cm[1] : null, true);
      if (htmlStr.length > maxHtmlLen) {
        maxHtmlLen = htmlStr.length;
        htmlText = htmlStr;
        if (loc) htmlBaseUrl = loc;
      }
      return;
    }

    if (loc || cid) {
      let absoluteUrl = loc || cid;
      try { if (loc) absoluteUrl = new URL(loc, htmlBaseUrl).href; } catch {}
      
      let rawName = (loc || cid).split('/').pop().split('?')[0].split('#')[0] || 'file';
      try { rawName = decodeURIComponent(rawName); } catch {}
      
      if (!rawName.includes('.')) {
        rawName += getExtension(mime);
      }
      
      rawName = rawName.replace(/[^a-zA-Z0-9.\-_]/g, '_');
      
      let filename = rawName;
      let counter = 1;
      while (usedNames.has(filename)) {
        const extIndex = rawName.lastIndexOf('.');
        const base = extIndex !== -1 ? rawName.slice(0, extIndex) : rawName;
        const ext = extIndex !== -1 ? rawName.slice(extIndex) : '';
        filename = `${base}_${counter}${ext}`;
        counter++;
      }
      usedNames.add(filename);

      const resObj = { mime, bytes, filename, originalUrl: loc || absoluteUrl, base64: null, zipPath: null };
      
      if (loc) {
        resources.set(loc, resObj);
        resources.set(loc.split('?')[0].split('#')[0], resObj);
      }
      if (cid) resources.set(cid, resObj);
      if (absoluteUrl) resources.set(absoluteUrl, resObj);
    }
  }

  for (const p of text.split('--' + boundary)) processPart(p);
  
  if (htmlText === null) throw new Error('لم يتم العثور على كود HTML');

  htmlText = fixMojibake(htmlText.replace(/\uFEFF/g, ''));

  if (mode === 'plain' || resources.size === 0) {
    return { html: ensureUtf8Meta(htmlText), files: [] };
  }

  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  
  // حفظ مسار الـ base الأصلي ومسح الوسم عشان الملفات المحلية تشتغل
  const baseEl = doc.querySelector('base[href]');
  if (baseEl) {
    try { htmlBaseUrl = new URL(baseEl.getAttribute('href'), htmlBaseUrl).href; } catch {}
    baseEl.remove();
  }

  if (forceDesktop) {
    doc.querySelectorAll('meta[name="viewport"]').forEach(el => el.remove());
    const meta = doc.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=1280, initial-scale=0.3';
    doc.head.appendChild(meta);
  }

  // إجبار خطوط الأيقونات على العمل
  const iconStyle = doc.createElement('style');
  iconStyle.textContent = `
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap');
    @import url('https://fonts.googleapis.com/icon?family=Material+Icons+Outlined|Material+Icons');
    .mat-icon, .google-symbols, .material-icons, .material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp {
      font-family: 'Material Symbols Outlined', 'Material Icons', sans-serif !important;
      font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
      letter-spacing: normal; text-transform: none; display: inline-block;
      white-space: nowrap; word-wrap: normal; direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
  `;
  doc.head.appendChild(iconStyle);

  const filesToZip = [];
  
  // تجهيز Base64 والملفات
  for (const [url, r] of resources) {
    if (!r.base64) {
      let bin = '';
      for (let i=0;i<r.bytes.length;i+=8192) bin += String.fromCharCode.apply(null, r.bytes.subarray(i,i+8192));
      r.base64 = `data:${r.mime};base64,${btoa(bin)}`;
      r.zipPath = '_files/' + r.filename;
      
      if (mode === 'zip') {
        filesToZip.push({ name: r.filename, bytes: r.bytes, modifiedBytes: null });
      }
    }
  }

  const resolve = (url, base) => {
    if (!url || url.startsWith('data:') || url.startsWith('blob:')) return null;
    if (url.startsWith('//')) url = 'https:' + url;
    
    let cleanUrl = url.split('?')[0].split('#')[0];
    if (resources.has(url)) return resources.get(url);
    if (resources.has(cleanUrl)) return resources.get(cleanUrl);
    
    if (url.startsWith('cid:')) {
      const cid = url.slice(4);
      if (resources.has(cid)) return resources.get(cid);
    }

    try {
      const abs = new URL(url, base || htmlBaseUrl).href;
      if (resources.has(abs)) return resources.get(abs);
      const absClean = abs.split('?')[0].split('#')[0];
      if (resources.has(absClean)) return resources.get(absClean);
    } catch {}

    const fileName = cleanUrl.split('/').pop();
    for (const [key, val] of resources) {
      if (key.endsWith('/' + fileName) || key === fileName) return val;
    }
    return null;
  };

  const processCss = (cssText, cssBase, isInsideFiles) => {
    // معالجة @import
    cssText = cssText.replace(/@import\s+(?:url\()?["']?([^"')]+)["']?\)?[^;]*;/g, (match, importUrl) => {
      if (importUrl.startsWith('data:')) return match;
      const r = resolve(importUrl, cssBase);
      if (r) {
        const importedCss = decodeBytes(r.bytes, null, false);
        return processCss(importedCss, r.originalUrl, isInsideFiles);
      }
      return match;
    });
    
    // معالجة url()
    return cssText.replace(/url\(["']?([^"')]+)["']?\)/g, (m, u) => {
      if (u.startsWith('data:')) return m;
      let url = u;
      if (url.startsWith('//')) url = 'https:' + url;
      const r = resolve(url, cssBase);
      if (!r) return m;
      if (mode === 'zip') {
        return `url("${isInsideFiles ? r.filename : r.zipPath}")`;
      } else {
        return `url("${r.base64}")`;
      }
    });
  };

  // 1. معالجة الـ CSS الداخلي
  for (const el of doc.querySelectorAll('style')) {
    el.textContent = processCss(el.textContent, htmlBaseUrl, false);
  }

  // 2. معالجة الـ CSS الخارجي (ملفات link)
  for (const el of doc.querySelectorAll('link')) {
    const rel = el.getAttribute('rel');
    if (rel === 'stylesheet' || (rel === 'preload' && el.getAttribute('as') === 'style')) {
      let href = el.getAttribute('href');
      const r = resolve(href, htmlBaseUrl);
      if (r) {
        if (mode === 'zip') {
          el.setAttribute('href', r.zipPath);
          el.removeAttribute('integrity');
          el.removeAttribute('crossorigin');
          // تعديل محتوى ملف الـ CSS جوه الزيب عشان يشاور على الصور اللي جنبه
          const cssText = decodeBytes(r.bytes, null, false);
          const modifiedCss = processCss(cssText, r.originalUrl, true);
          const fIndex = filesToZip.findIndex(f => f.name === r.filename);
          if (fIndex !== -1) filesToZip[fIndex].modifiedBytes = new TextEncoder().encode(modifiedCss);
        } else {
          const style = doc.createElement('style');
          const cssText = decodeBytes(r.bytes, null, false);
          style.textContent = processCss(cssText, r.originalUrl, false);
          el.replaceWith(style);
        }
      }
    }
  }

  // 3. معالجة الجافاسكريبت
  for (const el of doc.querySelectorAll('script')) {
    let src = el.getAttribute('src');
    if (src) {
      const r = resolve(src, htmlBaseUrl);
      if (r) {
        if (mode === 'zip') {
          el.setAttribute('src', r.zipPath);
          el.removeAttribute('integrity');
          el.removeAttribute('crossorigin');
        } else {
          el.removeAttribute('src');
          el.removeAttribute('integrity');
          el.removeAttribute('crossorigin');
          el.textContent = decodeBytes(r.bytes, null, false);
        }
      }
    }
  }

  // 4. معالجة الصور والوسائط
  for (const el of doc.querySelectorAll('[src]')) {
    let src = el.getAttribute('src');
    const r = resolve(src, htmlBaseUrl);
    if (r) {
      el.setAttribute('src', mode === 'zip' ? r.zipPath : r.base64);
      el.removeAttribute('integrity');
      el.removeAttribute('crossorigin');
    }
  }

  for (const el of doc.querySelectorAll('[poster]')) {
    const r = resolve(el.getAttribute('poster'), htmlBaseUrl);
    if (r) el.setAttribute('poster', mode === 'zip' ? r.zipPath : r.base64);
  }

  for (const el of doc.querySelectorAll('[href]')) {
    const tag = el.tagName.toLowerCase();
    if (tag === 'link' || tag === 'a' || tag === 'base') continue; 
    const r = resolve(el.getAttribute('href'), htmlBaseUrl);
    if (r) el.setAttribute('href', mode === 'zip' ? r.zipPath : r.base64);
  }

  // 5. معالجة الستايل المباشر
  for (const el of doc.querySelectorAll('[style]')) {
    const st = el.getAttribute('style');
    if (st.includes('url(')) el.setAttribute('style', processCss(st, htmlBaseUrl, false));
  }

  let finalHtml = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  
  // تحديث الملفات في الزيب بالملفات المعدلة (زي الـ CSS)
  filesToZip.forEach(f => {
    if (f.modifiedBytes) f.bytes = f.modifiedBytes;
  });

  return { html: ensureUtf8Meta(finalHtml), files: filesToZip };
}

function ensureUtf8Meta(html) {
  if (/<meta[^>]+charset\s*=\s*["']?utf-8/i.test(html)) return html;
  html = html.replace(/<meta[^>]+charset[^>]*>/gi, '');
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + '\n<meta charset="UTF-8">');
  return '<meta charset="UTF-8">\n' + html;
}
</script>
</body>
</html>
