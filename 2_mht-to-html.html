<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHT → HTML</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:560px;margin:0 auto;padding:20px 16px 40px;background:linear-gradient(160deg,#eef2f7,#f7f9fc);color:#1f2933;min-height:100vh}
  .box{background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 24px rgba(15,23,42,.08);border:1px solid #e5e9f0}
  h1{font-size:19px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  h1::before{content:"⇄";background:#0066cc;color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-size:15px}
  .hint{font-size:13px;color:#64748b;margin:0 0 14px}
  label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600;color:#334155}
  input[type=file]{width:100%;padding:12px;margin:0;font-size:15px;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:10px;cursor:pointer}
  input[type=file]:hover{border-color:#0066cc;background:#f0f7ff}
  select{width:100%;padding:12px;font-size:15px;border:1.5px solid #cbd5e1;border-radius:10px;background:#fff;color:#1f2933}
  select:focus,button:focus{outline:2px solid #0066cc;outline-offset:2px}
  button{width:100%;background:#0066cc;color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;transition:background .15s,transform .05s}
  button:hover:not(:disabled){background:#0052a3}
  button:active:not(:disabled){transform:scale(.98)}
  button:disabled{background:#cbd5e1;cursor:not-allowed}
  button.loading::after{content:"";display:inline-block;width:14px;height:14px;margin-inline-start:8px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;line-height:1.5;display:none}
  .status.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;display:block}
  .status.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;display:block}
  .status.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block}
  .info-note{margin-top:16px;padding:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13px;line-height:1.7;color:#78350f}
  @media (prefers-color-scheme: dark){
    body{background:#0f172a;color:#e2e8f0}
    .box{background:#1e293b;border-color:#334155}
    label{color:#cbd5e1}
    input[type=file]{background:#0f172a;border-color:#475569;color:#e2e8f0}
    select{background:#0f172a;border-color:#475569;color:#e2e8f0}
    .hint{color:#94a3b8}
    .info-note{background:#292014;border-color:#5c4813;color:#fbbf24}
  }
</style>
</head>
<body>
<div class="box">
  <h1>تحويل MHT / MHTML إلى HTML</h1>
  <p class="hint">كل حاجة بتحصل على جهازك — مفيش رفع لأي سيرفر.</p>

  <label>طريقة التحويل:</label>
  <select id="mode">
    <option value="single">HTML واحد — صور وCSS مدمجة (الأفضل)</option>
    <option value="plain">نص فقط — أسرع، بدون صور مدمجة</option>
  </select>

  <label>اختر الملف:</label>
  <input type="file" id="file" accept=".mht,.mhtml,.eml">

  <button id="go" disabled>تحويل وتنزيل</button>
  <div id="status" class="status"></div>

  <div class="info-note">
    💡 لو الملف فيه صفحات بتترسم بجافاسكريبت، الناتج ممكن يطلع فاضي لأننا بناخد HTML الساكن فقط.
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const status = (msg, cls) => { const s=$('status'); s.className='status '+cls; s.innerHTML = msg; };

$('file').addEventListener('change', () => { $('go').disabled = !$('file').files[0]; });

$('go').addEventListener('click', async () => {
  const f = $('file').files[0];
  if (!f) return;
  $('go').disabled = true;
  $('go').classList.add('loading');
  status('جاري التحويل…', 'info');
  try {
    // ✅ إصلاح: قراءة البايتات يدويًا (مش TextDecoder('latin1') اللي بيتحوّل لـ windows-1252)
    const buf = new Uint8Array(await f.arrayBuffer());
    let text = '';
    const CHUNK = 8192;
    for (let i = 0; i < buf.length; i += CHUNK) {
      text += String.fromCharCode.apply(null, buf.subarray(i, i + CHUNK));
    }

    const out = convertMHT(text, $('mode').value);
    const blob = new Blob([out], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name.replace(/\.(mht|mhtml|eml)$/i,'') + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);

    const kb = (blob.size/1024).toFixed(1);
    status(`تم التنزيل بنجاح ✓ <br><span style="opacity:.7">اسم الملف: ${a.download} — الحجم: ${kb} ك.ب</span>`, 'ok');
  } catch (e) {
    console.error(e);
    status('خطأ: ' + (e.message || e), 'err');
  } finally {
    $('go').disabled = false;
    $('go').classList.remove('loading');
  }
});

// ===== فك التشفير مع اكتشاف ذكي =====
function decodeBytes(bytes, charsetHint, isHtml) {
  // 1) BOM
  if (bytes.length >= 3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF)
    return new TextDecoder('utf-8').decode(bytes.subarray(3));
  if (bytes.length >= 2 && bytes[0]===0xFF && bytes[1]===0xFE)
    return new TextDecoder('utf-16le').decode(bytes.subarray(2));
  if (bytes.length >= 2 && bytes[0]===0xFE && bytes[1]===0xFF)
    return new TextDecoder('utf-16be').decode(bytes.subarray(2));

  // ✅ إصلاح: fatal:true عشان يفشل بدل ما يرجع �
  const tryCs = (cs) => {
    if (!cs) return null;
    try { return new TextDecoder(cs.trim().toLowerCase(), {fatal:true}).decode(bytes); }
    catch { return null; }
  };

  // 2) header
  let r = tryCs(charsetHint);
  if (r !== null) return r;

  // 3) meta tag
  if (isHtml) {
    const head = new TextDecoder('latin1').decode(bytes.subarray(0, Math.min(bytes.length, 4096)));
    const m = head.match(/charset\s*=\s*["']?([^"'\s/>;]+)/i);
    if (m) {
      r = tryCs(m[1]);
      if (r !== null) return r;
    }
  }

  // 4) UTF-8 صارم
  r = tryCs('utf-8');
  if (r !== null) return r;

  // 5) عربي/غربي قديم
  for (const cs of ['windows-1256','iso-8859-6','windows-1252','iso-8859-1']) {
    r = tryCs(cs);
    if (r !== null) return r;
  }

  // 6) آخر حل
  return new TextDecoder('utf-8').decode(bytes);
}

function convertMHT(text, mode) {
  const bm = text.match(/boundary\s*=\s*"?([^"\r\n;]+)"?/i);
  if (!bm) throw new Error('ملف MHT غير صالح: لم يتم العثور على boundary');
  const boundary = bm[1].trim();

  const rawParts = text.split('--' + boundary);
  const resources = new Map();
  let htmlText = null;
  let partCount = 0, imgCount = 0;

  for (let p of rawParts) {
    p = p.replace(/^(\r?\n)+/, '');
    if (p.startsWith('--') || !p.trim()) continue;

    const split = p.search(/\r?\n\r?\n/);
    if (split === -1) continue;
    const sep = p.substring(split).match(/^\r?\n\r?\n/)[0];
    const headerText = p.substring(0, split);
    let body = p.substring(split + sep.length).replace(/\r?\n$/, '');
    partCount++;

    const headers = {};
    let key = null;
    for (const line of headerText.split(/\r?\n/)) {
      if (/^[ \t]/.test(line) && key) headers[key] += ' ' + line.trim();
      else { const m = line.match(/^([^:]+):\s*(.*)$/); if (m){ key=m[1].toLowerCase(); headers[key]=m[2]; } }
    }

    const ct = (headers['content-type'] || '').toLowerCase();
    const enc = (headers['content-transfer-encoding'] || '').toLowerCase().trim();
    const loc = (headers['content-location'] || '').trim();
    const mime = ct.split(';')[0].trim() || 'application/octet-stream';
    const cm = ct.match(/charset\s*=\s*"?([^";\s]+)"?/);
    const charset = cm ? cm[1] : null;

    // فك إلى bytes
    let bytes;
    if (enc === 'base64') {
      const clean = body.replace(/[^A-Za-z0-9+/=]/g, '');
      let bin;
      try { bin = atob(clean); } catch { continue; }
      bytes = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    } else if (enc === 'quoted-printable') {
      const dec = body.replace(/=\r?\n|=\r/g,'').replace(/=([0-9A-F]{2})/gi,(_,h)=>String.fromCharCode(parseInt(h,16)));
      bytes = new Uint8Array(dec.length);
      for (let i=0;i<dec.length;i++) bytes[i] = dec.charCodeAt(i) & 0xff;
    } else {
      bytes = new Uint8Array(body.length);
      for (let i=0;i<body.length;i++) bytes[i] = body.charCodeAt(i) & 0xff;
    }

    if (mime === 'text/html' && htmlText === null) {
      htmlText = decodeBytes(bytes, charset, true);
    }

    if (loc && (mime.startsWith('image/') || mime.includes('css') || mime.includes('javascript') || mime.startsWith('font/'))) {
      if (mime.startsWith('image/')) imgCount++;
      let bin = '';
      for (let i=0;i<bytes.length;i+=8192) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+8192));
      resources.set(loc, { mime, dataUrl: `data:${mime};base64,${btoa(bin)}` });
    }
  }

  if (htmlText === null) throw new Error(`لم يتم العثور على HTML داخل الملف (تم تحليل ${partCount} جزء)`);
  if (mode === 'plain' || resources.size === 0) return ensureUtf8Meta(htmlText);

  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  const lookup = new Map();
  for (const [loc, r] of resources) {
    lookup.set(loc, r.dataUrl);
    const file = loc.split('/').pop().split('?')[0];
    if (file) lookup.set(file, r.dataUrl);
    try { lookup.set(decodeURIComponent(loc), r.dataUrl); } catch {}
  }
  const resolve = url => {
    if (!url || url.startsWith('data:') || url.startsWith('http')) return null;
    if (lookup.has(url)) return lookup.get(url);
    const file = url.split('/').pop().split('?')[0];
    return lookup.get(file) || null;
  };

  for (const el of doc.querySelectorAll('[src],[href],[poster]')) {
    for (const attr of ['src','href','poster']) {
      const u = el.getAttribute(attr);
      const d = u && resolve(u);
      if (d) el.setAttribute(attr, d);
    }
  }
  for (const el of doc.querySelectorAll('[style]')) {
    const st = el.getAttribute('style');
    if (st.includes('url(')) {
      el.setAttribute('style', st.replace(/url\(["']?([^"')]+)["']?\)/g, (m,u) => {
        const d = resolve(u); return d ? `url("${d}")` : m;
      }));
    }
  }
  for (const el of doc.querySelectorAll('style')) {
    el.textContent = el.textContent.replace(/url\(["']?([^"')]+)["']?\)/g, (m,u) => {
      const d = resolve(u); return d ? `url("${d}")` : m;
    });
  }

  console.log(`[MHT] أجزاء: ${partCount}، صور: ${imgCount}، موارد: ${resources.size}`);
  return ensureUtf8Meta('<!DOCTYPE html>\n' + doc.documentElement.outerHTML);
}

function ensureUtf8Meta(html) {
  if (/<meta[^>]+charset\s*=\s*["']?utf-8/i.test(html)) return html;
  html = html.replace(/<meta[^>]+charset[^>]*>/gi, '');
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + '\n<meta charset="UTF-8">');
  return '<meta charset="UTF-8">\n' + html;
}
</script>
</body>
</html>
